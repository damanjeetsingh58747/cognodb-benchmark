name: Validate benchmark evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile benchmark code
        run: python -m compileall -q benchmark

      - name: Audit committed benchmark evidence
        run: python benchmark/audit_results.py
