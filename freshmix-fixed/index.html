<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FreshMix Fibre</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAF7F1}iframe{border:0;width:100vw;height:100vh;display:block}.loading{font:600 14px system-ui;color:#171512;display:grid;place-items:center;height:100vh;letter-spacing:.08em}</style></head><body><div class="loading">LOADING FRESHMIX…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/damanjeetsingh58747/cognodb-benchmark/ce60d6f0cd89d276962ee5ede6bffbb1dfd0f780/freshmix2/';const parts=await Promise.all(Array.from({length:12},(_,i)=>fetch(base+'p'+String(i).padStart(2,'0')+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+i+' HTTP '+r.status);return r.text()})));const b=parts.join('').replace(/\s/g,'');if(b.length!==23180)throw new Error('payload length '+b.length);const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let html;if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}else{const{ungzip}=await import('https://esm.sh/pako@2.1.0');html=new TextDecoder().decode(ungzip(bytes))}const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))).map(x=>x.toString(16).padStart(2,'0')).join('');if(digest!=='9f401d90c7569940d91133a263f5ef95260c0fb10e6745809aa3ae59cbd1553d')throw new Error('source hash mismatch');if(!html.includes('.fm .bottle-svg'))throw new Error('detailed bottle source missing');document.body.innerHTML='';const f=document.createElement('iframe');f.title='FreshMix Fibre';f.srcdoc=html;document.body.appendChild(f)}catch(e){document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap;font:16px/1.5 system-ui;color:#8b1e12">FreshMix load error:\n'+e.message+'</pre>'}})()</script></body></html>
